services:
  # Serviciul pentru Baza de Date
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=learning_platform
    networks:
      - internal_net
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Serviciul pentru Aplicația Python
  app:
    build: .
    expose:
      - "8000"
    ports:
      - "8000:8000"  # expunem doar aplicația, nu baza de date
    depends_on:
      - db
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=learning_platform
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    volumes:
      - .:/app
    networks:
      - internal_net

volumes:
  postgres_data:

networks:
  internal_net:
    driver: bridge
    internal: false
